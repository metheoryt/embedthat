[project]
name = "embedthat"
version = "0.4.22"
description = "Embed links from social media and youtube into telegram"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.17.0",
    "aiosignal>=1.3.2",
    "dramatiq[redis]>=2.2.0,<3.0.0",
    "faster-whisper>=1.2.0",
    "ffmpeg-python>=0.2.0",
    "pydantic-settings>=2.7.1",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.1",
    "pytubefix>=11.1.0",
    "redis[hiredis]>=5.2.1",
    # Floor moved with the lock on purpose: 2026.7.4's Instagram extractor
    # resolved carousel posts to a child image item instead of the video, which
    # is 14 of the 44 jobs dead-lettered by 2026-09-15. A floor left behind the
    # lock lets any resolve that ignores uv.lock land back on the broken one.
    "yt-dlp>=2026.8.19",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["bot", "main.py"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
useLibraryCodeForTypes = true
typeCheckingMode = "standard"

reportMissingImports = "error"
reportMissingModuleSource = "warning"
reportMissingTypeStubs = "warning"
reportAttributeAccessIssue = "error"
reportMissingParameterType = "error"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "error"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUnknownLambdaType = "warning"
reportPrivateImportUsage = "warning"
reportWildcardImportFromLibrary = "warning"
reportImplicitOverride = "warning"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]   # ANN = flake8-annotations
ignore = ["ANN401"]                          # allow explicit Any where deliberate

[tool.ruff.format]

[dependency-groups]
dev = [
    "pydub-stubs>=0.25.1",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]
