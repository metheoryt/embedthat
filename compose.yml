services:
    bot:
        image: embedthat:dev
        build: .
        env_file:
            - .env
        volumes:
            - .:/app
            - bot_venv:/app/.venv
        restart: unless-stopped
    worker:
        image: embedthat:dev
        build: .
        env_file:
            - .env
        volumes:
            - .:/app
            - bot_venv:/app/.venv
        command: dramatiq bot.worker.actors --processes 1 --threads 4
        restart: unless-stopped
    redis:
        image: redis/redis-stack:latest
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        environment:
            REDIS_ARGS: "--save 60 1"
        restart: unless-stopped

volumes:
    redis_data:
    bot_venv:
