name: Docker Publish

# THIS IS THE DELIVERY PATH. A push to `main` publishes
# metheoryt/embedthat:latest, Tugtainer on latitude notices the new digest within
# 15 minutes and pulls it over the running containers. Nothing builds on the host.
#
# It was retired between 2026-07-25 and 2026-09-08 in favour of a poll-and-build
# engine that rebuilt the image on the homeserver -- and a registry tag was
# forbidden for exactly as long, because Tugtainer would have pull-updated over
# the locally built container and undone a deploy. That engine is PowerShell for
# the Windows box; prod now runs on Linux `latitude`, where it never ran at all,
# so the registry is the delivery path again and the conflict is gone with the
# local build.
#
# Docs-only pushes still publish. That is deliberate: a no-op image layer costs a
# cache-hit rebuild, whereas a paths-ignore filter silently skips a real fix the
# day someone edits a doc in the same commit.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            metheoryt/embedthat:latest
            metheoryt/embedthat:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
