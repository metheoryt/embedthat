name: Docker Publish

# THIS IS THE DELIVERY PATH, and only a **tag** walks it. Pushing a `v*` tag
# publishes metheoryt/embedthat:latest (plus the bare version); Tugtainer on
# latitude notices the new digest within 15 minutes and pulls it over the
# running containers. Nothing builds on the host. Both prod services pin
# `:latest`, so that ref has to keep moving on a release — it is the deploy
# channel, not a convenience alias.
#
# Nothing else runs automatically. A push to `main` builds nothing at all, which
# is the point: main is a place to land work without redeploying prod, and
# without spending a build on every doc fix.
#
# The one trigger that is not a tag is manual, and it reads its own ref:
#
#   workflow_dispatch on `main` (or any branch) -> builds, publishes NOTHING.
#       This is the Dockerfile smoke test. Reach for it after touching the
#       Dockerfile, uv.lock or a system dependency, because with main no longer
#       building on push, a broken image would otherwise surface at release time.
#   workflow_dispatch on a `v*` tag           -> builds and publishes, i.e. a
#       redeploy of that exact release.
#
# So `push: ${{ github.ref_type == 'tag' }}` is doing double duty and there is
# no way to publish `latest` off an untagged commit, deliberately.
#
# The version is taken from the tag and checked against pyproject.toml, which is
# bumped by hand. A disagreement fails the run rather than shipping an image
# whose reported version is a lie.
#
# It was retired between 2026-07-25 and 2026-09-08 in favour of a poll-and-build
# engine that rebuilt the image on the homeserver -- and a registry tag was
# forbidden for exactly as long, because Tugtainer would have pull-updated over
# the locally built container and undone a deploy. That engine is PowerShell for
# the Windows box; prod now runs on Linux `latitude`, where it never ran at all,
# so the registry is the delivery path again and the conflict is gone with the
# local build.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME says $VERSION but pyproject.toml says $PYPROJECT_VERSION — bump one to match before releasing"
              exit 1
            fi
          else
            VERSION="$PYPROJECT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            metheoryt/embedthat:latest
            metheoryt/embedthat:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
